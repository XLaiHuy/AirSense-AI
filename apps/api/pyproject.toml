[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airsense-api"
version = "0.1.0"
description = "FastAPI Backend for AirSense AI"
authors = [{ name = "AirSense AI Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
