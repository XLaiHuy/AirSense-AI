[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airsense-data-adapters"
version = "0.1.0"
description = "Resilient Data Ingestion Adapters for OpenAQ, Open-Meteo, and Local Sensors"
authors = [{ name = "AirSense AI Team" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
