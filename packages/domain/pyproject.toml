[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airsense-domain"
version = "0.1.0"
description = "Core Domain models, VN_AQI NowCast logic and quality validation for AirSense AI"
authors = [{ name = "AirSense AI Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
